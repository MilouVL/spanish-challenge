    .blank { border: none; border-bottom: 2px solid var(--accent); background: transparent; font-size: 1.15rem; font-family: "DM Sans", sans-serif; color: var(--ink); outline: none; min-width: 90px; text-align: center; padding: 0 4px; transition: border-color 0.2s; }

    .blank.correct { border-bottom-color: var(--green); color: var(--green); }
    .blank.wrong { border-bottom-color: var(--red); color: var(--red); }

const PER_DAY_NEW = 10;
const TAG_LABELS = { ar:"-ar", er:"-er", ir:"-ir", irreg:"irregular" };

let activeTab = localStorage.getItem('activeTab') || 'ind';

function getActivePool() { return activeTab === 'ind' ? ALL : ALL_IMP; }
function ns(key) { return activeTab + '_' + key; }

function setTab(tab) {
  activeTab = tab;
  localStorage.setItem('activeTab', tab);
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  stopTimer();
  exercises = []; current = 0; score = 0; checked = false; results = []; seconds = 0;
  init();
}

function getDailySeed() { const d = new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function seededShuffle(arr, seed) {
  const a=[...arr]; let s=seed;
  for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function getTodayKey() { return new Date().toISOString().slice(0,10); }
function getDateLabel() { return new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`; }

function loadStreak() { try { return JSON.parse(localStorage.getItem(ns("streak"))||"null")||{count:0,lastCompleted:null}; } catch { return {count:0,lastCompleted:null}; } }
function saveStreak(s) { try { localStorage.setItem(ns("streak"),JSON.stringify(s)); } catch {} }
function loadTodayState() { try { const s=JSON.parse(localStorage.getItem(ns("todayState"))||"null"); if(s&&s.dateKey===getTodayKey()) return s; return null; } catch { return null; } }
function saveTodayState(s) { try { localStorage.setItem(ns("todayState"),JSON.stringify(s)); } catch {} }

function makeKey(ex) { return (ex.before+ex.answer).split(" ").join(""); }
function loadReviewPile() { try { return JSON.parse(localStorage.getItem(ns("reviewPile"))||"{}"); } catch { return {}; } }
function saveReviewPile(p) { try { localStorage.setItem(ns("reviewPile"),JSON.stringify(p)); } catch {} }

function addToReviewPile(ex) {
  const pile = loadReviewPile(); const k = makeKey(ex);
  if (pile[k]) { pile[k].wrongCount=(pile[k].wrongCount||0)+1; pile[k].correctStreak=0; pile[k].lastSeen=getTodayKey(); }
  else { pile[k]={wrongCount:1,correctStreak:0,lastSeen:getTodayKey(),ex}; }
  saveReviewPile(pile);
}

function markReviewCorrect(ex) {
  const pile=loadReviewPile(); const k=makeKey(ex);
  if(!pile[k]) return;
  pile[k].correctStreak=(pile[k].correctStreak||0)+1;
  pile[k].lastSeen=getTodayKey();
  if(pile[k].correctStreak>=2) delete pile[k];
  saveReviewPile(pile);
}

function getReviewExercises() { return Object.values(loadReviewPile()).map(item=>({...item.ex,isReview:true})); }
function getReviewCount() { return Object.keys(loadReviewPile()).length; }

function buildExerciseList() {
  const pile=loadReviewPile(); const pileKeys=new Set(Object.keys(pile));
  const freshPool=getActivePool().filter(ex=>!pileKeys.has(makeKey(ex)));
  const todayFresh=seededShuffle(freshPool,getDailySeed()).slice(0,PER_DAY_NEW);
  const reviewExs=getReviewExercises();
  const shuffledReview=seededShuffle(reviewExs,getDailySeed()+1);
  return [...shuffledReview,...todayFresh];
}

let exercises=[],current=0,score=0,checked=false,results=[];
let seconds=0,timerInterval=null,streak={count:0,lastCompleted:null};
let newCount=0,reviewCount=0;

function startTimer(){timerInterval=setInterval(()=>{seconds++;const el=document.getElementById("timer");if(el)el.textContent=formatTime(seconds);},1000);}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

function init(){
  streak=loadStreak();
  const saved=loadTodayState();
  if(saved&&saved.completed){showDone(saved);return;}
  exercises=buildExerciseList();
  reviewCount=exercises.filter(e=>e.isReview).length;
  newCount=exercises.filter(e=>!e.isReview).length;
  if(saved){current=saved.current||0;score=saved.score||0;results=saved.results||[];seconds=saved.seconds||0;}
  else{current=0;score=0;results=[];seconds=0;}
  startTimer();render();
}

function getTenseLabel() {
  return activeTab==='ind'
    ? '<em>Pret. Indefinido</em>'
    : '<em>Pret. Imperfecto</em>';
}

function render(){
  const c=exercises[current];
  const isReview=!!c.isReview;
  const pct=(current/exercises.length)*100;
  const sl=streak.count>0?`${streak.count} day streak \uD83D\uDD25`:"No streak yet";
  const rCount=getReviewCount();
  const reviewBadgeClass=rCount>0?"badge review-badge":"badge review-badge empty";
  const reviewBadgeText=rCount>0?`\uD83D\uDCCB ${rCount} to review`:"\u2705 Review pile empty";

  document.getElementById("app").innerHTML=`
    <div class="meta-row">
      <span class="badge streak-badge">${sl}</span>
      <span class="${reviewBadgeClass}">${reviewBadgeText}</span>
      <span class="timer-badge" id="timer">${formatTime(seconds)}</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill ${isReview?"review":"new"}" style="width:${pct}%"></div>
    </div>
    <div class="progress-legend">
      <span><span class="legend-dot" style="background:var(--accent)"></span>${newCount} new</span>
      ${reviewCount>0?`<span><span class="legend-dot" style="background:var(--amber)"></span>${reviewCount} review</span>`:""}
    </div>
    <div class="card ${isReview?"is-review":""}">
      <div class="q-count">
        ${getDateLabel()} &middot; ${current+1} of ${exercises.length}
        ${isReview?"<span class=\"review-pill\">\uD83D\uDD04 Review</span>":""}
      </div>
      <div class="hint-row">Fill in: <strong>${c.hint}</strong> <span class="tag tag-${c.tag}">${TAG_LABELS[c.tag]}</span></div>
      <div class="sentence">
        <span>${c.before}</span>
        <input class="blank" id="inp" type="text" placeholder="___" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
        <span>${c.after}</span>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="translation" id="tr"></div>
    </div>
    <div class="btn-row" id="btns">
      <button class="primary" onclick="check()">Check answer</button>
      <button onclick="skip()">Show answer</button>
    </div>
    <div class="score-row" id="sc">Score: <span>${score}</span> / ${current}</div>
  `;
  const inp=document.getElementById("inp");
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
  inp.focus();checked=false;
}

function showTranslation(c){
  const trEl=document.getElementById("tr");
  if(trEl&&c.translation){trEl.innerHTML=`<span>${c.translation}</span>`;trEl.classList.add("visible");}
}

function check(){
  if(checked)return;
  const c=exercises[current];
  const inp=document.getElementById("inp");
  const val=inp.value.trim().toLowerCase();
  checked=true;
  const ok=val.toLowerCase()===c.answer.toLowerCase();
  inp.classList.add(ok?"correct":"wrong");inp.disabled=true;
  const fb=document.getElementById("fb");
  showTranslation(c);
  if(ok){
    score++;fb.className="feedback correct";
    if(c.isReview){
      markReviewCorrect(c);
      const remaining=getReviewCount();
      fb.textContent=remaining===0?"\u00a1Correcto! Removed from review pile \u2705":"\u00a1Correcto! One step closer to clearing review \u2705";
    } else {fb.textContent="\u00a1Correcto! \u2713";}
  } else {
    fb.className="feedback wrong";
    addToReviewPile(c);
    fb.textContent=c.isReview?`Not quite \u2014 ${c.answer}. Staying in review pile.`:`Not quite \u2014 ${c.answer}. Added to review pile.`;
  }
  results.push({correct:ok,answer:c.answer,given:val,isReview:!!c.isReview});
  document.getElementById("sc").innerHTML=`Score: <span>${score}</span> / ${current+1}`;
  document.getElementById("btns").innerHTML=`<button class="primary" onclick="next()">${current+1<exercises.length?"Next \u2192":"See results \u2192"}</button>`;
  saveTodayState({dateKey:getTodayKey(),current:current+1,score,results,seconds,completed:false});
}

function skip(){
  if(checked)return;
  const c=exercises[current];
  const inp=document.getElementById("inp");
  checked=true;inp.value=c.answer;inp.classList.add("wrong");inp.disabled=true;
  const fb=document.getElementById("fb");
  showTranslation(c);
  fb.className="feedback wrong";fb.textContent=`Answer: ${c.answer}. ${c.isReview?"Staying in review pile.":"Added to review pile."}`;
  addToReviewPile(c);
  results.push({correct:false,answer:c.answer,given:"",isReview:!!c.isReview});
  document.getElementById("sc").innerHTML=`Score: <span>${score}</span> / ${current+1}`;
  document.getElementById("btns").innerHTML=`<button class="primary" onclick="next()">${current+1<exercises.length?"Next \u2192":"See results \u2192"}</button>`;
  saveTodayState({dateKey:getTodayKey(),current:current+1,score,results,seconds,completed:false});
}

function next(){current++;if(current>=exercises.length)showSummary();else render();}

function showSummary(){
  stopTimer();
  const pct=Math.round((score/exercises.length)*100);
  const medal=pct===100?"\uD83E\uDD47":pct>=70?"\uD83E\uDD48":"\uD83E\uDD49";
  const msg=pct===100?"\u00a1Perfecto! Flawless!":pct>=80?"\u00a1Muy bien! Great work!":pct>=60?"\u00a1Bien! Solid effort!":"\u00a1Sigue adelante! Keep going!";
  const todayKey=getTodayKey();
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yKey=yesterday.toISOString().slice(0,10);
  let newStreak=streak.lastCompleted===yKey?streak.count+1:(streak.lastCompleted===todayKey?streak.count:1);
  saveStreak({count:newStreak,lastCompleted:todayKey});
  saveTodayState({dateKey:todayKey,current,score,results,seconds,completed:true});
  const reviewResults=results.filter(r=>r.isReview);
  const newResults=results.filter(r=>!r.isReview);
  const reviewCorrect=reviewResults.filter(r=>r.correct).length;
  const newCorrect=newResults.filter(r=>r.correct).length;
  const finalPileSize=getReviewCount();
  const dots=results.map(r=>{
    if(r.isReview)return r.correct?"<span>\uD83D\uDFE1</span>":"<span>\uD83D\uDD34</span>";
    return r.correct?"<span>\u2705</span>":"<span>\u274C</span>";
  }).join("");
  const reviewSection=reviewResults.length>0?`
    <div class="review-summary">
      <strong>Review pile</strong>
      ${reviewCorrect}/${reviewResults.length} review sentences correct &middot;
      ${finalPileSize>0?`${finalPileSize} sentence${finalPileSize===1?"":"s"} still to review`:"Review pile cleared! \uD83C\uDF89"}
    </div>`:"";
  document.getElementById("app").innerHTML=`
    <div class="summary">
      <div style="font-size:2.5rem;margin-bottom:0.3rem;">${medal}</div>
      <h2>Challenge complete!</h2>
      <div class="big">${score}/${exercises.length}</div>
      <div class="dots">${dots}</div>
      <div style="font-size:0.72rem;color:var(--ink3);margin-bottom:0.75rem;">\uD83D\uDFE1 review correct &nbsp; \uD83D\uDD34 review wrong &nbsp; \u2705 new correct &nbsp; \u274C new wrong</div>
      ${reviewSection}
      <p>${msg}</p>
      <p class="sub">Time: ${formatTime(seconds)} &middot; ${newStreak} day streak \uD83D\uDD25</p>
      <p class="sub">${newCorrect}/${newResults.length} new &middot; ${reviewCorrect}/${reviewResults.length} review</p>
      <button class="primary" onclick="playAgain()" style="margin-top:0.75rem;">Practice more</button>
    </div>
  `;
}

function showDone(saved){
  const finalPileSize=getReviewCount();
  const dots=(saved.results||[]).map(r=>{
    if(r.isReview)return r.correct?"<span>\uD83D\uDFE1</span>":"<span>\uD83D\uDD34</span>";
    return r.correct?"<span>\u2705</span>":"<span>\u274C</span>";
  }).join("");
  document.getElementById("app").innerHTML=`
    <div class="done-card">
      <div style="font-size:2.5rem;margin-bottom:0.5rem;">\uD83C\uDF2E</div>
      <h2>Already done today!</h2>
      <div class="big">${saved.score}/${saved.results?saved.results.length:PER_DAY_NEW}</div>
      <div style="font-size:1.2rem;margin:0.75rem 0;letter-spacing:2px;line-height:1.8;">${dots}</div>
      <p>Time: ${formatTime(saved.seconds||0)}</p>
      ${finalPileSize>0?`<p style="color:var(--amber);font-weight:500;">${finalPileSize} sentence${finalPileSize===1?"":"s"} in your review pile for tomorrow.</p>`:`<p style="color:var(--green);font-weight:500;">Review pile clear! \u2705</p>`}
      <p style="margin-bottom:1.25rem;">Come back tomorrow for a fresh set.</p>
      <button class="primary" onclick="playAgain()">Practice more today</button>
    </div>
  `;
}

function playAgain(){
  stopTimer();
  const pile=loadReviewPile(); const pileKeys=new Set(Object.keys(pile));
  const freshPool=getActivePool().filter(ex=>!pileKeys.has(makeKey(ex)));
  exercises=seededShuffle(freshPool,Date.now()).slice(0,10);
  reviewCount=0;newCount=exercises.length;
  current=0;score=0;results=[];seconds=0;
  startTimer();render();
}

// Render tab bar then init
document.addEventListener('DOMContentLoaded', function() {
  const tabBar = document.getElementById('tab-bar');
  tabBar.innerHTML = `
    <button class="tab-btn ${activeTab==='ind'?'active':''}" data-tab="ind" onclick="setTab('ind')">
      Indefinido <span class="tense-label">completed</span>
    </button>
    <button class="tab-btn ${activeTab==='imp'?'active':''}" data-tab="imp" onclick="setTab('imp')">
      Imperfecto <span class="tense-label">ongoing</span>
    </button>
  `;
  init();
});

</script>
